<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
    <link rel ="stylesheet" href="login.css">
</head>
<body>
	<a id="close" aria-hidden="true"></a>
	<header>
		<h2 class="logo">GYONGS |</h2>
		<nav class="navigation">
	     <a href="/">Home</a>
	     <a href="/contact.html">Contact</a>
	     <a href="/about.html">About</a>
	     <a href="/services.html">Services</a>
             <a href="#login-panel" class="btnlogin">login</a>
        </nav>
	</header>
	<div class="auth-wrapper">
		<div class="container register-container panel" id="register-panel">
			<a href="#close" class="icon-close" aria-label="Close register form"><ion-icon name="close-circle"></ion-icon></a>
			
			<!--register part-->
			
			<div class="reg-container" id="register">
				<form action="#" method="post">
					<h2 class="h2log">Registration</h2>

					<div class="input-box">
						<input type="text" class="input" id="username" name="username" required>
						<label for="username">Username</label>
						<span class="input-icon"><ion-icon name="person"></ion-icon></span>
					</div>
					<div class="input-box">
						<input type="email" class="input" id="register-email" name="register-email" required>
						<label for="register-email">Email</label>
						<span class="input-icon"><ion-icon name="mail"></ion-icon></span>
					</div>

					<div class="input-box">
						<input type="password" class="input" id="register-password" name="register-password" required>
						<label for="register-password">Password</label>
						<span class="input-icon"><ion-icon name="lock-closed"></ion-icon></span>
					</div>

					<div class="form-options">
						<div class="remember-forgot">
							<label class="remember">
								<input type="checkbox">i agreee to the terms and conditions
							</label>
						</div>
					</div>

					<button type="submit" class="btn">Create account</button>
					<div class="login-link"><p>Already have an account?<a href="#login-panel" class="toggle-link">Login</a></p></div>
				</form>
			</div>
		</div>
		<div class="container panel" id="login-panel">
			<a href="#close" class="icon-close" aria-label="Close login form"><ion-icon name="close-circle"></ion-icon></a>
			
			<main id="login">
				
				<form action="#" method="post">
					<h2 class="h2log">login</h2>
					
					<div class="input-box">
						<input type="email" class="input" id="email" name="email" required>
						<label for="email">Email</label>
						<span class="input-icon"><ion-icon name="mail"></ion-icon></span>
					</div>


					<div class="input-box">
						<input type="password" class="input" id="password" name="password" required>
						<label for="password">Password</label>
						<span class="input-icon"><ion-icon name="lock-closed"></ion-icon></span>
					</div>
		        

				<div class="form-options">
					<div class="remember-forgot">
						<label class="remember">
							<input type="checkbox">Remember me
						</label>
					</div>
					<a class="forgot" href="forgot-password">forgot password</a>
				</div>

				<button type="submit" class="btn">Log in</button>
				<div class="register-link"><p>Don't have an account?<a href="#register-panel" class="toggle-link">Register</a></p></div>
					
				</form>
			</main>
		</div>
	</div>
</body>
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</html>
