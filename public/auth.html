<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYONGS | Login & Register</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<a id="close" aria-hidden="true"></a>
<header>
<h2 class="logo">GYONGS |</h2>
<nav class="navigation">
<a href="/">Home</a>
<a href="/contact.html">Contact</a>
<a href="/about.html">About</a>
<a href="/services.html">Services</a>
<a href="#login-panel" class="btnlogin">login</a>
</nav>
</header>
<div class="auth-wrapper">
<div class="container register-container panel" id="register-panel">
<a href="#close" class="icon-close" aria-label="Close">X</a>
<div class="reg-container">
<form id="rf" method="post">
<h2 class="h2log">Registration</h2>
<div class="input-box">
<input class="input" id="username" required>
<label for="username">Name</label>
</div>
<div class="input-box">
<input class="input" id="register-email" type="email" required>
<label for="register-email">Email</label>
</div>
<div class="input-box">
<input class="input" id="register-password" type="password" required minlength="3">
<label for="register-password">Password</label>
</div>
<div class="input-box">
<input class="input" id="register-confirm" type="password" required minlength="3">
<label for="register-confirm">Confirm Password</label>
</div>
<p id="rmsg"></p>
<button class="btn" type="submit">Create account</button>
<p>Have an account? <a href="#login-panel" class="toggle-link">Login</a></p>
</form>
</div>
</div>
<div class="container panel" id="login-panel">
<a href="#close" class="icon-close" aria-label="Close">X</a>
<main id="login">
<form id="lf" method="post">
<h2 class="h2log">GYONGS login</h2>
<div class="input-box">
<input class="input" id="email" type="email" required>
<label for="email">Email</label>
</div>
<div class="input-box">
<input class="input" id="password" type="password" required>
<label for="password">Password</label>
</div>
<p id="lmsg"></p>
<button class="btn" type="submit">Log in</button>
<p>No account? <a href="#register-panel" class="toggle-link">Register</a></p>
</form>
</main>
</div>
</div>
<script src="/auth-ui.js"></script>
</body>
</html>
